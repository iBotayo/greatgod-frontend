<!-- Suppressing Navigation Shells due to Linear/Transactional intent (Login) -->
<body class="bg-surface-paper min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<main class="w-full max-w-[400px] flex flex-col">
<!-- Brand Header -->
<header class="text-center mb-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">GreatGod</h1>
<p class="font-body-md text-body-md text-secondary mt-2">Sign in to your stewardship account</p>
</header>
<!-- Error Banner -->
<div class="bg-error-container border-l-4 border-error p-4 rounded-r-lg mb-stack-sm flex gap-3 items-start shadow-sm" role="alert">
<span class="material-symbols-outlined text-on-error-container shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-error-container leading-tight pt-0.5">The email or password entered is incorrect.</p>
</div>
</div>
<!-- Form Container -->
<div class="bg-surface-linen p-6 rounded-xl border border-outline-variant shadow-sm mb-stack-md">
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Email Field (Error State) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 uppercase tracking-widest pl-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-error" style="font-size: 20px;">mail</span>
<input aria-invalid="true" autocomplete="email" class="w-full bg-surface-container-lowest border-2 border-error text-on-surface pl-10 pr-4 py-3 rounded-md font-body-md text-body-md focus:outline-none focus:border-error focus:ring-1 focus:ring-error" id="email" name="email" type="email" value="steward@example.com"/>
</div>
</div>
<!-- Password Field (Error State) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 uppercase tracking-widest pl-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-error" style="font-size: 20px;">key</span>
<input aria-invalid="true" autocomplete="current-password" class="w-full bg-surface-container-lowest border-2 border-error text-on-surface pl-10 pr-4 py-3 rounded-md font-body-md text-body-md focus:outline-none focus:border-error focus:ring-1 focus:ring-error" id="password" name="password" type="password" value="********"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest py-4 rounded-full mt-2 hover:bg-primary/90 transition-colors active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Secondary Action (Recovery) -->
<div class="text-center">
<a class="font-label-sm text-label-sm text-primary uppercase tracking-widest hover:underline underline-offset-4 transition-all" href="#">
                Forgot Password?
            </a>
</div>
<!-- Stewardship Footer (Contextual for transactional flows) -->
<footer class="mt-stack-lg flex flex-col items-center gap-2 opacity-80">
<span class="material-symbols-outlined text-success-secure" style="font-size: 18px;">lock</span>
<p class="font-label-sm text-label-sm text-success-secure uppercase tracking-widest">Secure SSL Connection</p>
</footer>
