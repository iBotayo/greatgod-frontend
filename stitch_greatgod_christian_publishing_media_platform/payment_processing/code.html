<style>
          .material-symbols-outlined {
              font-family: 'Material Symbols Outlined';
              font-weight: normal;
              font-style: normal;
              font-size: 24px;  /* Preferred icon size */
              line-height: 1;
              letter-spacing: normal;
              text-transform: none;
              display: inline-block;
              white-space: nowrap;
              word-wrap: normal;
              direction: ltr;
              -webkit-font-feature-settings: 'liga';
              -webkit-font-smoothing: antialiased;
          }
          
          /* Slow, deliberate rotation for a calming effect */
          @keyframes serene-spin {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
          }
          
          .animate-serene-spin {
              animation: serene-spin 3s linear infinite;
          }

          /* Gentle pulsing for the text */
          @keyframes gentle-pulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.6; }
          }

          .animate-gentle-pulse {
              animation: gentle-pulse 4s ease-in-out infinite;

<body class="bg-background h-full flex flex-col items-center justify-center text-on-background relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 50%, var(--tw-colors-surface-variant) 0%, transparent 70%);"></div>
<main class="w-full max-w-form-width px-margin-mobile flex flex-col items-center justify-center z-10">
<!-- The Processing Vessel -->
<div class="w-full bg-surface-linen rounded-lg p-stack-md flex flex-col items-center text-center border border-outline-variant shadow-sm relative">
<!-- Progress Indicator -->
<div class="relative w-24 h-24 mb-stack-sm flex items-center justify-center">
<!-- Outer Track -->
<svg class="absolute inset-0 w-full h-full text-surface-dim" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-width="2"></circle>
</svg>
<!-- Animated Progress Segment -->
<svg class="absolute inset-0 w-full h-full text-primary animate-serene-spin" style="transform-origin: center;" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-dasharray="80 289" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<!-- Inner Icon -->
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    volunteer_activism
                </span>
</div>
<!-- Messaging -->

            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[300px] mb-stack-md">

            </p>
<!-- Trust Indicator / Footer equivalent for loading state -->
<div class="w-full pt-stack-sm border-t border-outline-variant flex flex-col items-center gap-unit">
