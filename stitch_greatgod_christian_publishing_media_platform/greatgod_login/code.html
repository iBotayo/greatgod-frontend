<body class="bg-surface text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed per logic: Linear/Transactional screen) -->
<!-- The navigation shell is intentionally excluded to prioritize the login task. -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile md:px-0 py-stack-lg relative overflow-hidden">
<!-- Subtle decorative background element -->
<div class="absolute inset-0 z-0 opacity-30 pointer-events-none" style="background-image: radial-gradient(circle at top right, var(--tw-colors-secondary-container), transparent 50%), radial-gradient(circle at bottom left, var(--tw-colors-surface-container-highest), transparent 50%);"></div>
<div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md md:p-stack-lg shadow-[0_4px_24px_-8px_rgba(0,0,0,0.05)] relative z-10 flex flex-col items-center">
<!-- Brand Logo Area -->
<div class="mb-stack-md flex flex-col items-center text-center">
<span class="font-display-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight mb-unit">GreatGod</span>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<form class="w-full flex flex-col gap-stack-sm">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 px-4 py-3 transition-shadow ease-serif duration-200" id="email" name="email" placeholder="reader@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors ease-serif duration-200" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest font-body-md text-body-md text-on-surface px-4 py-3 transition-shadow ease-serif duration-200" id="password" name="password" required="" type="password"/>
</div>
<!-- Sign In Button -->
<button class="w-full mt-2 bg-primary-container text-on-primary-container font-label-sm text-label-sm uppercase rounded py-4 px-6 hover:bg-primary transition-colors ease-serif duration-300 flex justify-center items-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-stack-sm">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Or continue with</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="w-full flex flex-col gap-unit">
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low border border-outline-variant text-on-surface font-label-sm text-label-sm uppercase rounded py-3 px-6 hover:bg-surface-container transition-colors ease-serif duration-200" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">account_circle</span> <!-- Using generic icon as placeholder for Google -->
                    Google
                </button>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low border border-outline-variant text-on-surface font-label-sm text-label-sm uppercase rounded py-3 px-6 hover:bg-surface-container transition-colors ease-serif duration-200" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">file_download</span>
                    Apple
                </button>
</div>
<!-- Create Account Link -->
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 decoration-1 transition-all ease-serif duration-200" href="#">Create an Account</a>
</p>
</div>
</div>
</main>
<!-- Footer component from JSON (Simplified for login context, focused on legal) -->
<footer class="w-full py-stack-md px-margin-mobile md:px-stack-lg flex flex-col items-center gap-stack-sm bg-surface-container-low border-t border-outline-variant">
