<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-gutter font-body-md">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 flex items-center justify-center p-margin-mobile md:p-gutter transition-opacity duration-300">
<!-- Modal Content -->
<div class="bg-surface-bright w-full max-w-md rounded-xl shadow-lg border border-surface-variant overflow-hidden flex flex-col transform transition-all duration-300 scale-100 z-50">
<!-- Header -->
<div class="flex items-center justify-between p-stack-sm border-b border-surface-variant">
<h2 class="font-headline-md text-headline-md text-on-surface m-0 tracking-tight">Share this Insight</h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors p-1 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Content preview -->
<div class="p-stack-sm bg-surface-container-lowest flex gap-stack-sm items-center border-b border-surface-variant">
<div class="w-16 h-16 shrink-0 rounded bg-surface-container overflow-hidden">
<img alt="Article thumbnail" class="w-full h-full object-cover" data-alt="A small, elegant thumbnail image depicting a calm, softly lit study room with old books and a modern reading lamp, casting warm light on parchment-colored pages. The scene embodies a refined, intellectual, and contemplative mood, typical of a sacred editorial aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBytNfHEVJCv7feaLg1225nHh7Hd2YN2j1qtBmGRluhauw5OdY4FlXIwcqeMcbwSAH_UDArDA8WkI7Y4wjbWri-77u-gdcMfqoGHeoVmWknECpA1RADlISW6HpZP5yw8O-NfK1URnIM8fI-nbSNbMJEklHo7NW7aQqbTquHCWJ5QVfkqwcyeDq3PeynvUXk4Aj6pF6tevGw6vM2c5oi4fAhwvm5I4bw-6kGhRGc52ST7lQ5QSaGTzDM"/>
</div>
<div class="flex flex-col justify-center">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-1">Article</span>
<h3 class="font-body-md text-body-md font-medium text-on-surface line-clamp-2">The Architecture of Silence: Finding Stillness in the Modern Age</h3>
</div>
</div>
<!-- Body -->
<div class="p-stack-sm flex flex-col gap-stack-md">
<!-- Share Grid -->
<div>
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-stack-sm">Share via</h4>
<div class="grid grid-cols-4 gap-unit">
<!-- Copy Link -->
<button class="flex flex-col items-center justify-center gap-2 p-unit rounded-lg hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
</div>
<span class="font-label-sm text-[11px] text-on-surface-variant text-center">Copy Link</span>
</button>
<!-- Email -->
<button class="flex flex-col items-center justify-center gap-2 p-unit rounded-lg hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<span class="font-label-sm text-[11px] text-on-surface-variant text-center">Email</span>
</button>
<!-- Messages -->
<button class="flex flex-col items-center justify-center gap-2 p-unit rounded-lg hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</div>
<span class="font-label-sm text-[11px] text-on-surface-variant text-center">Messages</span>
</button>
<!-- WhatsApp (Mock) -->
<button class="flex flex-col items-center justify-center gap-2 p-unit rounded-lg hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="forum">forum</span>
</div>
<span class="font-label-sm text-[11px] text-on-surface-variant text-center">WhatsApp</span>
</button>
</div>
</div>
<!-- Personal Note -->
<div>
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Add a Personal Note</h4>
<textarea class="w-full h-24 bg-surface rounded-lg border border-surface-variant p-3 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none transition-shadow" placeholder="Thought you might find this interesting..."></textarea>
</div>
</div>
<!-- Actions -->
<div class="p-stack-sm border-t border-surface-variant bg-surface flex justify-end gap-stack-sm">
<button class="px-6 py-2 rounded font-label-sm text-label-sm text-secondary hover:text-on-surface transition-colors">Cancel</button>
<button class="px-6 py-2 rounded bg-primary-container text-on-primary-container font-label-sm text-label-sm hover:opacity-90 transition-opacity">Share</button>
</div>
</div>
</div>
