<body class="bg-background text-on-background min-h-screen font-body-md antialiased relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Texture / Scrim -->

<!-- Main Centered Canvas for Modal -->
<main class="fixed inset-0 z-50 flex items-center justify-center p-margin-mobile sm:p-gutter">
<!-- Modal Container (Level 2 Surface) -->
<div class="bg-surface-container-lowest w-full max-w-lg shadow-xl ring-1 ring-outline/20 relative overflow-hidden">
<!-- Subtle Top Warning Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-error"></div>
<!-- Modal Content -->
<div class="p-8 sm:p-10 flex flex-col gap-stack-sm">
<!-- Header with Icon -->
<div class="flex items-start gap-4 mb-2">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-error-container text-on-error-container flex items-center justify-center mt-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">warning</span>
</div>
<div class="flex-col gap-2">
<h2 class="font-headline-md text-headline-md text-on-surface" id="modal-title">Delete Permanently?</h2>
</div>
</div>
<!-- Body Text -->
<div class="ml-16 pr-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                        This action is irreversible and will remove all associated stewardship records. Please ensure this is the intended course of action before proceeding.
                    </p>
</div>
<!-- Structural Divider -->
<hr class="border-t border-outline-variant my-4 ml-16"/>
<!-- Action Area -->
<div class="flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4 ml-16 mt-2">
<button class="inline-flex justify-center items-center px-6 py-2.5 border border-outline bg-transparent text-on-surface font-label-sm text-label-sm hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="button">
                        Cancel
                    </button>
<button class="inline-flex justify-center items-center px-6 py-2.5 border border-transparent bg-error text-on-error font-label-sm text-label-sm hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface-container-lowest shadow-sm" type="button">

</div>
