<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Article Editor - GreatGod</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-primary": "#ffb3ad",
                      "on-error-container": "#93000a",
                      "surface-dim": "#dbdad5",
                      "background": "#fbf9f4",
                      "on-error": "#ffffff",
                      "on-primary-fixed": "#410004",
                      "tertiary-fixed-dim": "#e9c349",
                      "inverse-on-surface": "#f2f1ec",
                      "inverse-surface": "#30312e",
                      "secondary-container": "#d8e2dd",
                      "surface-container-high": "#eae8e3",
                      "tertiary-fixed": "#ffe088",
                      "outline": "#887270",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#574500",
                      "on-primary": "#ffffff",
                      "on-tertiary-container": "#4e3d00",
                      "error": "#ba1a1a",
                      "tertiary": "#735c00",
                      "on-secondary-container": "#5b6561",
                      "on-primary-fixed-variant": "#7e2a27",
                      "secondary": "#57605d",
                      "on-surface": "#1b1c19",
                      "surface-container-low": "#f5f3ee",
                      "on-tertiary-fixed": "#241a00",
                      "primary-fixed": "#ffdad7",
                      "on-secondary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed-dim": "#ffb3ad",
                      "surface-container": "#f0eee9",
                      "error-container": "#ffdad6",
                      "secondary-fixed-dim": "#bfc9c4",
                      "on-secondary-fixed": "#141d1a",
                      "surface": "#fbf9f4",
                      "surface-tint": "#9c413d",
                      "surface-container-highest": "#e4e2dd",
                      "secondary-fixed": "#dbe5e0",
                      "on-surface-variant": "#554240",
                      "on-background": "#1b1c19",
                      "primary-container": "#5d1212",
                      "surface-bright": "#fbf9f4",
                      "on-secondary-fixed-variant": "#3f4945",
                      "surface-variant": "#e4e2dd",
                      "tertiary-container": "#cca72f",
                      "primary": "#3e0003",
                      "on-primary-container": "#e27770",
                      "outline-variant": "#dbc0be"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "stack-sm": "16px",
                      "stack-md": "32px",
                      "gutter": "32px",
                      "container-max": "1120px",
                      "unit": "8px",
                      "stack-lg": "64px",
                      "margin-mobile": "20px"
              },
              "fontFamily": {
                      "body-md": [
                              "\"Source Serif 4\""
                      ],
                      "headline-md": [
                              "EB Garamond"
                      ],
                      "headline-lg": [
                              "EB Garamond"
                      ],
                      "body-lg": [
                              "\"Source Serif 4\""
                      ],
                      "headline-lg-mobile": [
                              "EB Garamond"
                      ],
                      "display-lg": [
                              "EB Garamond"
                      ],
                      "label-sm": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "17px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-lg": [
                              "40px",
                              {
                                      "lineHeight": "48px",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-lg": [
                              "20px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg-mobile": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-lg": [
                              "64px",
                              {
                                      "lineHeight": "72px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "500"
                              }
                      ],
                      "label-sm": [
                              "13px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.08em",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim font-display-lg text-display-lg-mobile md:text-display-lg docked full-width top-0 border-b border-outline-variant dark:border-outline flat no shadows duration-200 ease-in-out fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-stack-lg h-16">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="font-display-lg text-headline-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tight">GreatGod</span>
</div>
<div class="hidden md:flex items-center gap-6">
<div class="flex flex-col items-end">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Autosave: Saved</span>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-70">1,240 words · 6 min read</span>
</div>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Main Editor Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-0 w-full max-w-[720px] mx-auto flex flex-col gap-8">
<!-- Editor Header (Mobile Info) -->
<div class="md:hidden flex justify-between items-center pb-4 border-b border-outline-variant">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Autosave: Saved</span>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-70">1,240 words · 6 min read</span>
</div>
<!-- Title & Subtitle Inputs -->
<div class="flex flex-col gap-4">
<input class="w-full bg-transparent border-none focus:ring-0 font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface placeholder-on-surface-variant/50 p-0" placeholder="Enter article title..." type="text"/>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface-variant placeholder-on-surface-variant/50 p-0 italic" placeholder="Add a descriptive subtitle..." type="text"/>
</div>
<!-- Toolbar (Sticky) -->
<div class="sticky top-16 z-40 bg-surface-container-low/90 backdrop-blur-md border border-outline-variant rounded-lg p-2 flex flex-wrap gap-2 items-center justify-between">
<div class="flex items-center gap-1">
<button class="p-2 rounded hover:bg-surface-container-high transition-colors text-on-surface-variant" title="Bold">
<span class="material-symbols-outlined" data-icon="format_bold">format_bold</span>
</button>
<button class="p-2 rounded hover:bg-surface-container-high transition-colors text-on-surface-variant" title="Italic">
<span class="material-symbols-outlined" data-icon="format_italic">format_italic</span>
</button>
<div class="w-px h-6 bg-outline-variant mx-1"></div>
<button class="p-2 rounded hover:bg-surface-container-high transition-colors text-on-surface-variant" title="Heading">
<span class="material-symbols-outlined" data-icon="format_h1">format_h1</span>
</button>
<div class="w-px h-6 bg-outline-variant mx-1"></div>
<button class="p-2 rounded hover:bg-surface-container-high transition-colors text-on-surface-variant" title="Bullet List">
<span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span>
</button>
<button class="p-2 rounded hover:bg-surface-container-high transition-colors text-on-surface-variant" title="Quote">
<span class="material-symbols-outlined" data-icon="format_quote">format_quote</span>
</button>
<div class="w-px h-6 bg-outline-variant mx-1"></div>
<button class="p-2 rounded hover:bg-surface-container-high transition-colors text-on-surface-variant" title="Insert Image">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
</div>
<div class="flex items-center gap-2">
<button class="flex items-center gap-1 font-label-sm text-label-sm text-primary px-3 py-1.5 rounded border border-primary/20 hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="menu_book">menu_book</span>
                    Scripture
                </button>
<button class="flex items-center gap-1 font-label-sm text-label-sm text-secondary px-3 py-1.5 rounded border border-outline-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="sell">sell</span>
                    Tags
                </button>
</div>
</div>
<!-- Rich Text Area -->
<div class="font-body-md text-body-md text-on-surface min-h-[442px] focus:outline-none" contenteditable="true">
<p class="mb-4">Begin writing your manuscript here. The spirit of the editorial rests in the clarity of the word and the intent of the author...</p>
</div>
</main>
<!-- Bottom Actions Bar -->
<div class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline-variant py-4 px-margin-mobile md:px-stack-lg flex justify-between items-center shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<button class="font-label-sm text-label-sm text-secondary hover:text-on-surface transition-colors">
            Save &amp; Exit
        </button>
<div class="flex items-center gap-4">
<button class="font-label-sm text-label-sm text-secondary hover:text-on-surface transition-colors px-4 py-2 rounded-lg border border-outline-variant hover:bg-surface-container-low">
                Preview
            </button>
<button class="font-label-sm text-label-sm bg-primary-container text-on-primary px-6 py-2 rounded-lg hover:opacity-90 transition-opacity shadow-sm">
                Submit for Review
            </button>
</div>
</div>
</body></html>
