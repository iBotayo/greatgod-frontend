<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&amp;family=Hanken+Grotesk:wght@400;600;700&amp;family=Source+Serif+4:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { background-color: theme('colors.surface-paper'); color: theme('colors.on-surface'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .progress-bar-fill { transition: width 3s ease-in-out; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-gutter">
<!-- Progress State Vessel -->
<main class="w-full max-w-form-width bg-surface-linen border border-outline rounded-lg p-stack-md flex flex-col items-center text-center shadow-sm relative transition-opacity duration-500" id="progress-state">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-stack-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="cloud_download">cloud_download</span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-primary mb-2">Downloading Manuscript</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">Acquiring 'The Imitation of Christ' (PDF) securely to your device.</p>
<!-- Progress Bar -->
<div class="w-full max-w-xs mb-4">
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden border border-outline-variant">
<div class="h-full bg-primary progress-bar-fill w-0 rounded-full" id="progress-fill"></div>
</div>
</div>
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" id="progress-text">0% Complete</p>
<!-- Stewardship Footer (Locked) -->
<div class="mt-stack-lg flex items-center justify-center gap-2 text-success-secure">
<span class="material-symbols-outlined text-sm" data-icon="lock" data-weight="fill">lock</span>
<span class="font-label-sm text-label-sm uppercase">Secure SSL Connection</span>
</div>
</main>
<!-- Success State Vessel (Hidden Initially) -->
<main class="hidden w-full max-w-form-width bg-surface-linen border border-outline rounded-lg p-stack-md flex flex-col items-center text-center shadow-sm relative transition-opacity duration-500 opacity-0" id="success-state">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-success-secure/10 flex items-center justify-center mb-stack-sm border border-success-secure/30">
<span class="material-symbols-outlined text-success-secure text-3xl" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-primary mb-2">Download Complete</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">'The Imitation of Christ' has been successfully saved to your library.</p>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
<button class="bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest px-8 py-4 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="menu_book">menu_book</span>
                Open File
            </button>
<button class="bg-transparent text-primary border border-outline hover:border-primary font-label-sm text-label-sm uppercase tracking-widest px-8 py-4 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
                Return to Library
            </button>
</div>
</main>
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const progressState = document.getElementById('progress-state');
            const successState = document.getElementById('success-state');

            // Simulate progress
            setTimeout(() => {
                progressFill.style.width = '100%';
                
                let percent = 0;
                const interval = setInterval(() => {
                    percent += 3.33; // Approx 100 / 30 steps (3s duration)
                    if (percent >= 100) {
                        percent = 100;
                        clearInterval(interval);
                        
                        // Transition to success state
                        setTimeout(() => {
                            progressState.style.opacity = '0';
                            setTimeout(() => {
                                progressState.classList.add('hidden');
                                successState.classList.remove('hidden');
                                // Trigger reflow for transition
                                void successState.offsetWidth;
                                successState.style.opacity = '1';
                            }, 500); // Wait for fade out
                        }, 500); // Brief pause at 100%
                    }
                    progressText.textContent = `${Math.floor(percent)}% Complete`;
                }, 100);
            }, 500); // Start after slight delay
        });
    </script>
</body></html>
