<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
        }

            transition: border-color 0.2s ease-in-out, border-width 0.2s ease-in-out;
        }
        
        .input-focus:focus-within {
            border-color: #3e0003 !important; /* primary */
            border-width: 2px !important;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- Top Navigation (Transactional, no tabs) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 max-w-container-max mx-auto border-b border-outline-variant bg-surface">
<button aria-label="Go Back" class="text-primary hover:bg-surface-container-low transition-colors rounded-full p-2 flex items-center justify-center group">
<span class="material-symbols-outlined group-hover:opacity-80 transition-opacity duration-200">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-primary tracking-tight">GreatGod</div>
<div class="w-[40px]"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-stack-lg">
<!-- The "Giving Vessel" (Centered fixed grid) -->
<div class="w-full max-w-form-width bg-surface-linen rounded-xl border border-stone-outline p-stack-md flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Subtle decorative texture/overlay (Optional, kept minimal) -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 50% 0%, #3e0003 0%, transparent 60%);"></div>
<!-- Header -->
<div class="text-center relative z-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-unit">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your stewardship journey.</p>
</div>
<!-- Form Area -->
<form action="#" class="flex flex-col gap-stack-md relative z-10" method="POST">
<!-- Inputs Container -->
<div class="flex flex-col gap-stack-sm">
<!-- Email Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="email">Email Address</label>
<div class="relative flex items-center border border-stone-outline rounded bg-surface-container-lowest input-focus input-border-transition overflow-hidden">
<span class="material-symbols-outlined text-outline ml-3 absolute pointer-events-none">mail</span>
<input class="w-full bg-transparent border-none py-3 pl-10 pr-3 font-body-md text-on-surface focus:ring-0 placeholder-outline-variant" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="password">Password</label>
<div class="relative flex items-center border border-stone-outline rounded bg-surface-container-lowest input-focus input-border-transition overflow-hidden">
<span class="material-symbols-outlined text-outline ml-3 absolute pointer-events-none">lock</span>
<input class="w-full bg-transparent border-none py-3 pl-10 pr-3 font-body-md text-on-surface focus:ring-0 placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Form Options (Remember Me & Forgot Password) -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-stone-outline rounded focus:ring-primary focus:ring-2 focus:ring-offset-surface-linen cursor-pointer" name="remember" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed underline decoration-transparent hover:decoration-primary transition-all" href="#">Forgot password?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-lg hover:bg-on-primary-fixed transition-colors mt-unit shadow-sm flex items-center justify-center gap-2 group" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-on-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Registration Link -->
<div class="text-center border-t border-outline-variant pt-stack-sm relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed underline transition-colors ml-1" href="#">Register</a>
</p>
</div>
<!-- Trust Footer -->
<div class="text-center pt-stack-sm border-t border-surface-dim mt-stack-sm flex flex-col items-center gap-1 opacity-80">
<div class="flex items-center justify-center gap-1 text-success-secure">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm uppercase">Secure SSL Encrypted Connection</span>
</div>
</div>
</div>
</main>
<!-- Footer Component from JSON -->
<footer class="w-full py-stack-md px-margin-mobile text-center flex flex-col items-center gap-unit bg-surface-paper border-t border-surface-linen mt-stack-lg">
<div class="font-label-lg text-label-lg text-primary">GreatGod</div>
<p class="font-body-md text-body-md text-secondary">© 2024 GreatGod Media. All donations are tax-deductible.</p>
<div class="flex flex-wrap justify-center gap-4 mt-2">
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Secure SSL Encrypted</a>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Terms of Stewardship</a>
</div>
</footer>
</body></html>
