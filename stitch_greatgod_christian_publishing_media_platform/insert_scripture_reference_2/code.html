<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scripture Reference Selector</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffe088",
                        "on-primary-fixed-variant": "#7e2a27",
                        "surface-container-high": "#eae8e3",
                        "primary": "#3e0003",
                        "on-primary": "#ffffff",
                        "primary-container": "#5d1212",
                        "surface-dim": "#dbdad5",
                        "tertiary-container": "#cca72f",
                        "outline": "#887270",
                        "primary-fixed-dim": "#ffb3ad",
                        "error-container": "#ffdad6",
                        "on-surface": "#1b1c19",
                        "surface-container-low": "#f5f3ee",
                        "inverse-on-surface": "#f2f1ec",
                        "on-secondary-container": "#5b6561",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#e27770",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#dbc0be",
                        "surface-container": "#f0eee9",
                        "on-tertiary": "#ffffff",
                        "secondary": "#57605d",
                        "secondary-fixed": "#dbe5e0",
                        "surface": "#fbf9f4",
                        "inverse-primary": "#ffb3ad",
                        "surface-bright": "#fbf9f4",
                        "inverse-surface": "#30312e",
                        "secondary-fixed-dim": "#bfc9c4",
                        "on-secondary-fixed": "#141d1a",
                        "on-tertiary-fixed": "#241a00",
                        "on-tertiary-fixed-variant": "#574500",
                        "background": "#fbf9f4",
                        "primary-fixed": "#ffdad7",
                        "surface-container-highest": "#e4e2dd",
                        "surface-variant": "#e4e2dd",
                        "on-surface-variant": "#554240",
                        "on-tertiary-container": "#4e3d00",
                        "tertiary-fixed-dim": "#e9c349",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#3f4945",
                        "tertiary": "#735c00",
                        "on-primary-fixed": "#410004",
                        "on-background": "#1b1c19",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "secondary-container": "#d8e2dd",
                        "surface-tint": "#9c413d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "stack-sm": "16px",
                        "stack-lg": "64px",
                        "stack-md": "32px",
                        "gutter": "32px",
                        "container-max": "1120px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "label-sm": ["Hanken Grotesk"],
                        "headline-lg": ["EB Garamond"],
                        "headline-md": ["EB Garamond"],
                        "display-lg": ["EB Garamond"],
                        "body-lg": ["\"Source Serif 4\""],
                        "headline-lg-mobile": ["EB Garamond"],
                        "body-md": ["\"Source Serif 4\""]
                    },
                    "fontSize": {
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "500" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "500" }],
                        "body-md": ["17px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #e5e5e5; /* Simulate editor background behind overlay */
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">
<!-- Overlay Background -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Scripture Reference Selector Dialog -->
<div class="relative z-50 bg-surface w-full max-w-2xl rounded shadow-2xl overflow-hidden border border-outline-variant flex flex-col">
<!-- Header -->
<div class="px-stack-sm py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Scripture Reference</h2>
<button aria-label="Close dialog" class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-full p-1">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-stack-md flex-grow flex flex-col gap-stack-md overflow-y-auto">
<!-- Search and Translation -->
<div class="flex flex-col md:flex-row gap-4">
<div class="flex-grow relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:ring-offset-surface transition-all font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70" placeholder="e.g., Romans 8:28" type="text" value="Romans 8:28"/>
</div>
<div class="md:w-1/3 shrink-0 relative">
<select class="w-full pl-4 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:ring-offset-surface transition-all font-label-sm text-label-sm text-on-surface appearance-none cursor-pointer">
<option value="ESV">ESV - English Standard Version</option>
<option value="NIV">NIV - New International Version</option>
<option value="KJV">KJV - King James Version</option>
<option value="NASB">NASB - New American Standard</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Preview Area -->
<div class="bg-surface-container-low border border-outline-variant rounded p-stack-sm relative">
<span class="absolute -top-3 left-4 bg-surface-container-low px-2 font-label-sm text-label-sm text-secondary">Preview</span>
<div class="pt-2">
<h3 class="font-headline-md text-body-lg text-on-surface mb-2">Romans 8:28 <span class="text-sm font-normal text-on-surface-variant ml-2">ESV</span></h3>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
<sup class="text-xs mr-1">28</sup>And we know that for those who love God all things work together for good, for those who are called according to his purpose.
                    </p>
</div>
</div>
<!-- Options -->
<div class="flex items-center gap-3 mt-2">
<input class="w-5 h-5 border-outline-variant rounded text-primary-container focus:ring-primary-container bg-surface-container-lowest cursor-pointer" id="primary-ref" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="primary-ref">Mark as Primary Reference for this section</label>
</div>
</div>
<!-- Footer Actions -->
<div class="px-stack-sm py-4 border-t border-outline-variant bg-surface-container-lowest flex justify-end gap-4 items-center">
<button class="px-6 py-2 border border-outline text-on-surface font-label-sm text-label-sm rounded hover:bg-surface-container-low hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
                Cancel
            </button>
<button class="px-6 py-2 bg-primary-container text-on-primary font-label-sm text-label-sm rounded hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                Insert into Draft
            </button>
</div>
</div>
</body></html>
