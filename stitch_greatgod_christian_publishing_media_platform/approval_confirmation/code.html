<style>
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success-circle-draw {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCircle 1s ease-out forwards;
        }
        
        .success-check-draw {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.5s ease-out 0.6s forwards;
        }
        
        @keyframes drawCircle {
            to { stroke-dashoffset: 0; }
        }
        
        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-primary">
<!-- Main Content Canvas (Transactional - No Navigation Shell) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter">
<div class="max-w-2xl w-full mx-auto">
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-8 md:p-12 text-center shadow-[0_4px_24px_rgba(0,0,0,0.02)] fade-in-up">
<!-- Animated Success Icon -->
<div class="flex justify-center mb-8 fade-in-up delay-1">
<svg class="w-24 h-24 text-primary-container" fill="none" viewbox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
<circle class="success-circle-draw" cx="26" cy="26" r="24" stroke="currentColor" stroke-linecap="round" stroke-width="2"></circle>
<path class="success-check-draw" d="M16 26L23 33L36 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Text Content -->
<div class="space-y-4 mb-10 fade-in-up delay-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">
                        Manuscript Approved
                    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                        Ready for taxonomy assignment and scheduling. The author has been notified of this milestone.
                    </p>
</div>
<!-- Divider Flourish -->
<div class="flex items-center justify-center mb-10 fade-in-up delay-3">
<div class="h-px bg-gradient-to-r from-transparent via-outline-variant to-transparent w-48"></div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row items-center justify-center gap-4 fade-in-up delay-4">
<button class="w-full sm:w-auto bg-primary-container hover:bg-primary text-on-primary font-label-sm text-label-sm py-3 px-8 rounded flex items-center justify-center gap-2 transition-colors duration-200">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">account_tree</span>
                        Assign Taxonomy
                    </button>
<button class="w-full sm:w-auto border border-outline hover:border-primary text-on-surface font-label-sm text-label-sm py-3 px-8 rounded flex items-center justify-center gap-2 transition-colors duration-200 hover:text-primary hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">queue_play_next</span>
                        Return to Queue
                    </button>
</div>
</div>
<!-- Contextual Metadata -->
<div class="mt-8 text-center fade-in-up delay-4">
<p class="font-label-sm text-label-sm text-secondary opacity-70 flex items-center justify-center gap-2">
<span>Manuscript ID: 1042-X</span>
<span class="text-outline-variant">|</span>
<span>Approved by Managing Editor</span>
</p>
</div>
</div>
</main>
