<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-stack-lg h-16 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline transition-colors duration-200 ease-in-out">

<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-stack-lg px-margin-mobile md:px-stack-lg flex justify-center w-full">
<div class="w-full max-w-[720px] flex flex-col gap-stack-lg">
<!-- Page Header -->
<section class="flex flex-col gap-unit items-center text-center pt-stack-sm">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">New Draft</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Begin a new work of reflection or teaching.</p>
</section>
<!-- Form -->
<form class="flex flex-col gap-stack-md bg-surface-container-lowest p-stack-md md:p-stack-lg rounded-xl border border-outline-variant/50 shadow-sm relative overflow-hidden">
<!-- Subtle Flourish Divider -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-[1px] bg-gradient-to-r from-transparent via-outline-variant to-transparent"></div>
<!-- Working Title Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="working-title">Working Title</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded p-3 font-headline-md text-headline-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow bg-white" id="working-title" name="working-title" placeholder="E.g., Thoughts on Grace" required="" type="text"/>
</div>
<!-- Content Type & Language Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Content Type Dropdown -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="content-type">Content Type</label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline-variant rounded p-3 pr-10 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow bg-white cursor-pointer" id="content-type" name="content-type">
<option value="article">Article</option>
<option value="devotional">Devotional</option>
<option value="essay">Essay</option>
<option value="podcast_transcript">Podcast Transcript</option>
<option value="study_notes">Study Notes</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Language Dropdown -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="language">Language</label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline-variant rounded p-3 pr-10 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow bg-white cursor-pointer" id="language" name="language">
<option value="en">English</option>
<option value="es">Español</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
</select>
