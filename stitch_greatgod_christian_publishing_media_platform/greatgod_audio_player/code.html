<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Smooth transition for minimizable player */
        #full-player {
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.4s ease;
        }
        #full-player.minimized {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        
        #mini-player {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
            transform: translateY(150%);
            opacity: 0;
        }
        #mini-player.active {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #5d1212; /* primary-container */
            cursor: pointer;
            margin-top: -5px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #dbc0be; /* outline-variant */
            border-radius: 1px;
        }
        input[type=range]:focus {
            outline: none;
        }
      </style>
<style>

<!-- Main Full Screen Player View -->

<span>45:00</span>

</div>

<button aria-label="Skip forward 15 seconds" class="text-on-surface-variant hover:text-primary transition-colors p-3 rounded-full hover:bg-surface-container-low active:scale-90">
<span class="material-symbols-outlined text-[28px]" data-icon="forward_10">forward_10</span>

</div>
<!-- Minimize Action -->

<span class="material-symbols-outlined mb-1" data-icon="explore">explore</span>
<span class="font-label-sm text-label-sm">Discover</span>
</a>
<!-- Library (Inactive - Assuming context is playing a specific item, library might not be strictly active, but player usually floats over it. We'll leave all inactive for full-screen player context unless intended otherwise. Let's make Podcasts/Sermons context map to Library or similar, but instructions say map to intent. The player is a modal/overlay state, so nav might be suppressed. However, instructions say "Standard list layouts... BottomNav destination count 4". If this is a destination screen for 'Podcasts', map to Library maybe? We will keep them generic inactive since it's an overlay.) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed scale-100 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="library_books">library_books</span>
<span class="font-label-sm text-label-sm">Library</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed scale-100 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const fullPlayer = document.getElementById('full-player');
            const miniPlayer = document.getElementById('mini-player');
            const btnMinimize = document.getElementById('btn-minimize');
            const btnCloseMini = document.getElementById('btn-close-mini');

            // Minimize action
            btnMinimize.addEventListener('click', () => {
                fullPlayer.classList.add('minimized');
                miniPlayer.classList.add('active');
            });

            // Maximize action (clicking mini player body)
            miniPlayer.addEventListener('click', (e) => {
                // Don't maximize if clicking the close or play buttons
                if(e.target.closest('button')) return;
                
                fullPlayer.classList.remove('minimized');
                miniPlayer.classList.remove('active');
            });

            // Close mini player entirely
            btnCloseMini.addEventListener('click', (e) => {
                e.stopPropagation();
                miniPlayer.classList.remove('active');
                // In a real app, this might stop playback and return to main screen
            });
        });
    </script>
